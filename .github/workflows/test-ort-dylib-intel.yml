name: test-ort-dylib-intel

# 验证 x86_64 libonnxruntime.dylib（自编译或任意来源）能否加载并对真实图像推理。
on:
  workflow_dispatch:
    inputs:
      dylib_url:
        description: 'x86_64 libonnxruntime.dylib 下载 URL（支持 .dylib 或 .tgz）'
        type: string
        required: true
        default: "https://github.com/James-boy/PrivBgCut-Deps/releases/download/deps-ort-v1.23.2/libonnxruntime-1.23.2-x86_64.dylib"
      u2netp_url:
        description: '（可选）u2netp.onnx URL'
        type: string
        required: false
        default: 'https://www.modelscope.cn/models/xiaoer123456/Heliosoph_u2net-onnx/resolve/master/u2netp.onnx?view=false'
      birefnet_url:
        description: '（可选）birefnet-lite-dynamic.onnx URL'
        type: string
        required: false
        default: 'https://hf-mirror.com/senty-au/BiRefNet_lite-ONNX-dynamic/resolve/main/onnx/model.onnx?download=true'
      ppmatting_url:
        description: '（可选）ppmatting-hrnet-w18.onnx URL'
        type: string
        required: false
        default: 'https://www.modelscope.cn/models/xiaoer123456/Heliosoph_u2net-onnx/resolve/master/ppmatting-hrnet-w18.onnx?view=false'
      test_image_url:
        description: '真实测试图片 URL（用于 Matting 模型，避免随机噪声导致全 0）'
        type: string
        required: true
        default: 'https://bj.bcebos.com/paddlehub/fastdeploy/matting_input.jpg'

concurrency:
  group: test-ort-dylib-intel
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15-intel   # 原生 x86_64
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner is x86_64
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          sw_vers
          test "$(uname -m)" = "x86_64" \
            || { echo "ERROR: runner 不是 x86_64，请检查 runs-on 标签"; exit 1; }
          echo "OK: native x86_64 runner"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ort-test
          key: ort-dylib-test-intel
          cache-targets: true

      # ── 自动补上 image 解码依赖（与 ARM 版保持一致）────────
      - name: Add image dependency
        shell: bash
        run: |
          set -euo pipefail
          cargo add image \
            --manifest-path ort-test/Cargo.toml \
            --no-default-features \
            --features jpeg,png

      # ── 下载 dylib（兼容 .tgz 和裸 .dylib）───────────────
      - name: Download dylib
        shell: bash
        env:
          DYLIB_URL: ${{ inputs.dylib_url }}
        run: |
          set -euo pipefail
          mkdir -p ort-test-dylib
          if [[ "$DYLIB_URL" == *.tgz ]] || [[ "$DYLIB_URL" == *.tar.gz ]]; then
            echo "Detected tarball, downloading and extracting..."
            curl -fL --retry 3 --retry-delay 2 -o /tmp/ort.tgz "$DYLIB_URL"
            rm -rf /tmp/ort-extract
            mkdir -p /tmp/ort-extract
            tar -xzf /tmp/ort.tgz -C /tmp/ort-extract

            echo "--- extracted tree (top 3 levels) ---"
            find /tmp/ort-extract -maxdepth 3 \( -type f -o -type l \) | head -50

            DYLIB_PATH=""
            if [ -e /tmp/ort-extract/lib/libonnxruntime.dylib ]; then
              DYLIB_PATH=/tmp/ort-extract/lib/libonnxruntime.dylib
            else
              DYLIB_PATH=$(find /tmp/ort-extract -type f -name 'libonnxruntime.dylib' | head -1)
            fi
            if [ -z "$DYLIB_PATH" ]; then
              DYLIB_PATH=$(find /tmp/ort-extract -type f -name 'libonnxruntime*.dylib' | head -1)
            fi
            if [ -z "$DYLIB_PATH" ]; then
              echo "ERROR: 解压目录中未找到 libonnxruntime*.dylib"
              echo "实际文件列表："
              find /tmp/ort-extract \( -type f -o -type l \) | head -100
              exit 1
            fi
            echo "Selected dylib: $DYLIB_PATH"
            ls -lh "$DYLIB_PATH"

            cp -L "$DYLIB_PATH" ort-test-dylib/libonnxruntime.dylib
          else
            curl -fL --retry 3 --retry-delay 2 -o ort-test-dylib/libonnxruntime.dylib "$DYLIB_URL"
          fi

          ls -lh ort-test-dylib/libonnxruntime.dylib
          file ort-test-dylib/libonnxruntime.dylib
          lipo -info ort-test-dylib/libonnxruntime.dylib
          ARCHS=$(lipo -archs ort-test-dylib/libonnxruntime.dylib)
          echo "$ARCHS" | grep -qw x86_64 || { echo "ERROR: dylib 不含 x86_64 slice"; exit 1; }
          nm -gU ort-test-dylib/libonnxruntime.dylib | grep -q OrtGetApiBase \
            || { echo "ERROR: 缺少 OrtGetApiBase 符号"; exit 1; }
          echo "OK: OrtGetApiBase present"

      # ── 下载模型 ────────────────────────────────────────────
      - name: Download u2netp
        if: inputs.u2netp_url != ''
        shell: bash
        env:
          URL: ${{ inputs.u2netp_url }}
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 -o models/u2netp.onnx "$URL"
          ls -lh models/u2netp.onnx

      - name: Download birefnet
        if: inputs.birefnet_url != ''
        shell: bash
        env:
          URL: ${{ inputs.birefnet_url }}
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 -o models/birefnet-lite-dynamic.onnx "$URL"
          ls -lh models/birefnet-lite-dynamic.onnx

      - name: Download ppmatting
        if: inputs.ppmatting_url != ''
        shell: bash
        env:
          URL: ${{ inputs.ppmatting_url }}
        run: |
          set -euo pipefail
          mkdir -p models
          curl -fL --retry 3 --retry-delay 2 -o models/ppmatting-hrnet-w18.onnx "$URL"
          ls -lh models/ppmatting-hrnet-w18.onnx

      - name: Verify at least one model present
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          for f in models/u2netp.onnx models/birefnet-lite-dynamic.onnx models/ppmatting-hrnet-w18.onnx; do
            if [ -f "$f" ]; then echo "OK: $f ($(du -h "$f" | cut -f1))"; COUNT=$((COUNT + 1)); fi
          done
          test "$COUNT" -gt 0 || { echo "ERROR: 一个模型都没下载到"; exit 1; }
          echo "共 $COUNT 个模型待测"

      # ── 下载真实测试图片 ───────────────────────────────────
      - name: Download test image
        shell: bash
        env:
          URL: ${{ inputs.test_image_url }}
        run: |
          set -euo pipefail
          mkdir -p testdata
          curl -fL --retry 3 --retry-delay 2 -o testdata/input.jpg "$URL"
          ls -lh testdata/input.jpg
          file testdata/input.jpg

      # ── 编译测试二进制 ─────────────────────────────────────
      - name: Build test binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --manifest-path ort-test/Cargo.toml
          TEST_BIN="ort-test/target/release/ort_dylib_test"
          test -x "$TEST_BIN" || { echo "ERROR: 测试二进制缺失"; exit 1; }
          lipo -info "$TEST_BIN"
          lipo -archs "$TEST_BIN" | grep -qw x86_64 || { echo "ERROR: 测试二进制不是 x86_64"; exit 1; }
          echo "TEST_BIN=$TEST_BIN" >> $GITHUB_ENV

      # ── 运行测试 ───────────────────────────────────────────
      - name: Run dylib + model inference test
        shell: bash
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/ort-test-dylib/libonnxruntime.dylib
          TEST_IMAGE_PATH: ${{ github.workspace }}/testdata/input.jpg
        run: |
          set -euo pipefail
          MODEL_ARGS=""
          for m in u2netp.onnx birefnet-lite-dynamic.onnx ppmatting-hrnet-w18.onnx; do
            if [ -f "models/$m" ]; then MODEL_ARGS="$MODEL_ARGS models/$m"; fi
          done
          echo "测试模型: $MODEL_ARGS"
          echo "测试图片: $TEST_IMAGE_PATH"
          echo "dylib: $ORT_DYLIB_PATH"
          # shellcheck disable=SC2086
          "$TEST_BIN" $MODEL_ARGS

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ORT dylib test (x86_64)"
            echo ""
            echo "- dylib_url: \`${{ inputs.dylib_url }}\`"
            echo "- test_image_url: \`${{ inputs.test_image_url }}\`"
            echo "- runner: \`$(uname -m)\` on macOS $(sw_vers -productVersion)"
            echo ""
            echo "预期结果："
            echo "- 若 dylib 包含 DeformConv，birefnet 应 PASS"
            echo "- u2netp / ppmatting 在真实图片输入下应 PASS"
          } >> $GITHUB_STEP_SUMMARY
