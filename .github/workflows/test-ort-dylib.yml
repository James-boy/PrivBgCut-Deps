name: test-ort-dylib

# 验证任意来源的 libonnxruntime.dylib 是否能加载并推理。
# 典型用途：验证从 PR #27393 源码编译出的 x86_64 dylib。
#
# 模型 URL 需公开可访问（curl 直接拉），因为主项目是私有仓，
# 无法通过 actions/cache 跨仓共享模型。建议把模型文件放到
# PrivBgCut-Deps 公开仓的 Release 里，用它的 asset URL。
on:
  workflow_dispatch:
    inputs:
      dylib_url: 'https://github.com/James-boy/PrivBgCut-Deps/releases/download/deps-ort-v1.23.2/libonnxruntime-1.23.2-x86_64.dylib'
        description: 'libonnxruntime.dylib 下载 URL'
        type: string
        required: true
      u2netp_url:
        description: '（可选）u2netp.onnx 下载 URL，留空则跳过'
        type: string
        required: false
        default: ''
      birefnet_url: 
        description: '（可选）birefnet-lite-dynamic.onnx 下载 URL，留空则跳过'
        type: string
        required: false
        default: 'https://hf-mirror.com/senty-au/BiRefNet_lite-ONNX-dynamic/resolve/main/onnx/model.onnx?download=true'
      ppmatting_url:
        description: '（可选）ppmatting-hrnet-w18.onnx 下载 URL，留空则跳过'
        type: string
        required: false
        default: ''

concurrency:
  group: test-ort-dylib
  cancel-in-progress: true

jobs:
  test:
    # 用 Intel runner，直接原生运行 x86_64 dylib，
    # 避免 Rosetta 引入额外变量。
    runs-on: macos-15-intel
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存（同仓内有效，跟模型缓存无关）
      # 如果连这个也不想用，把这一步删掉即可，只是每次编译会变慢。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: dylib-test
          cache-targets: true

      # ── 下载模型（按需，留空的跳过）─────────────────────
      - name: Download u2netp
        if: inputs.u2netp_url != ''
        shell: bash
        env:
          URL: ${{ inputs.u2netp_url }}
        run: |
          set -euo pipefail
          mkdir -p models
          echo "Downloading u2netp from: $URL"
          curl -fL --retry 3 --retry-delay 2 -o models/u2netp.onnx "$URL"
          ls -lh models/u2netp.onnx

      - name: Download birefnet
        if: inputs.birefnet_url != ''
        shell: bash
        env:
          URL: ${{ inputs.birefnet_url }}
        run: |
          set -euo pipefail
          mkdir -p models
          echo "Downloading birefnet from: $URL"
          curl -fL --retry 3 --retry-delay 2 -o models/birefnet-lite-dynamic.onnx "$URL"
          ls -lh models/birefnet-lite-dynamic.onnx

      - name: Download ppmatting
        if: inputs.ppmatting_url != ''
        shell: bash
        env:
          URL: ${{ inputs.ppmatting_url }}
        run: |
          set -euo pipefail
          mkdir -p models
          echo "Downloading ppmatting from: $URL"
          curl -fL --retry 3 --retry-delay 2 -o models/ppmatting-hrnet-w18.onnx "$URL"
          ls -lh models/ppmatting-hrnet-w18.onnx

      - name: Verify at least one model present
        shell: bash
        run: |
          set -euo pipefail
          COUNT=0
          for f in models/u2netp.onnx models/birefnet-lite-dynamic.onnx models/ppmatting-hrnet-w18.onnx; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(du -h "$f" | cut -f1))"
              COUNT=$((COUNT + 1))
            fi
          done
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: 一个模型都没下载到，检查 URL 输入"
            exit 1
          fi
          echo "共 $COUNT 个模型待测"

      # ── 下载待测 dylib ─────────────────────────────────────
      - name: Download dylib
        shell: bash
        env:
          DYLIB_URL: ${{ inputs.dylib_url }}
        run: |
          set -euo pipefail
          mkdir -p ort-test
          curl -fL --retry 3 --retry-delay 2 \
            -o ort-test/libonnxruntime.dylib \
            "$DYLIB_URL"
          ls -lh ort-test/libonnxruntime.dylib
          echo "--- architecture ---"
          lipo -info ort-test/libonnxruntime.dylib
          ARCHS=$(lipo -archs ort-test/libonnxruntime.dylib)
          echo "Architectures: $ARCHS"
          echo "$ARCHS" | grep -qw x86_64 \
            || { echo "ERROR: dylib 不含 x86_64 slice"; exit 1; }
          # 检查 OrtGetApiBase 符号（dlopen 成功的必要条件）
          nm -gU ort-test/libonnxruntime.dylib | grep -q OrtGetApiBase \
            || { echo "ERROR: 缺少 OrtGetApiBase 符号"; exit 1; }
          echo "OK: OrtGetApiBase present"

      # ── 编译测试二进制 ─────────────────────────────────────
      - name: Build test binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release \
            --manifest-path src-tauri/Cargo.toml \
            --features dylib-test \
            --bin ort_dylib_test
          TEST_BIN="src-tauri/target/release/ort_dylib_test"
          test -x "$TEST_BIN" || { echo "ERROR: 测试二进制缺失"; exit 1; }
          echo "TEST_BIN=$TEST_BIN" >> $GITHUB_ENV

      # ── 运行测试 ───────────────────────────────────────────
      - name: Run dylib + model inference test
        shell: bash
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/ort-test/libonnxruntime.dylib
        run: |
          set -euo pipefail
          # 收集所有实际存在的模型
          MODEL_ARGS=""
          for m in u2netp.onnx birefnet-lite-dynamic.onnx ppmatting-hrnet-w18.onnx; do
            if [ -f "models/$m" ]; then
              MODEL_ARGS="$MODEL_ARGS models/$m"
            fi
          done
          echo "测试模型列表: $MODEL_ARGS"
          echo "使用 dylib: $ORT_DYLIB_PATH"
          # shellcheck disable=SC2086
          "$TEST_BIN" $MODEL_ARGS

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ORT dylib test"
            echo ""
            echo "- dylib_url: \`${{ inputs.dylib_url }}\`"
            echo "- u2netp_url: \`${{ inputs.u2netp_url }}\`"
            echo "- birefnet_url: \`${{ inputs.birefnet_url }}\`"
            echo "- ppmatting_url: \`${{ inputs.ppmatting_url }}\`"
            echo "- runner: macos-15-intel (x86_64 native)"
          } >> $GITHUB_STEP_SUMMARY
